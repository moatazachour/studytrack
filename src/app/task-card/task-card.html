<div class="task-card">
  <div class="task-card__top">
    <h2 class="task-card__title">{{ task().title }}</h2>
    <p class="task-card__status">{{ task().status }}</p>
  </div>
  <span class="task-card__subject">{{ task().subject }}</span>
  <span class="priority-label">{{ task().priority }}</span>
</div>
