<div class="app-shell">
  <header class="hero">
    <p class="hero-eyebrow">StudyTrack</p>
    <h1 class="hero-title">My Study Dashboard</h1>
    <p class="hero-subtitle">Track your progress, one task at a time.</p>
  </header>
  <div class="summary-grid">
    <div class="summary-tile">
      <p class="summary-value">{{ totalCount() }}</p>
      <p class="summary-label">Total</p>
    </div>
    <div class="summary-tile">
      <p class="summary-value">{{ completedCount() }}</p>
      <p class="summary-label">Completed</p>
    </div>
    <div class="summary-tile">
      <p class="summary-value">{{ remainingCount() }}</p>
      <p class="summary-label">Remaining</p>
    </div>
  </div>
  <app-goal-counter />
  <div class="panel">
    <p class="panel-heading">My Tasks</p>
    <div class="field-row">
      <input
        type="text"
        class="text-input"
        name="taskInput"
        placeholder="Enter a new study task..."
        [(ngModel)]="taskTitle"
      />
      <button
        class="btn btn-primary"
        (click)="addTask(taskTitle())"
        [disabled]="taskTitle().trim() === ''"
      >
        Add
      </button>
    </div>
    <p class="input-preview">{{ taskTitle() }}</p>
    <div class="task-grid">
      @for (task of tasks(); track task.id) {
        <app-task-card [task]="task" />
      }
    </div>
  </div>
</div>
