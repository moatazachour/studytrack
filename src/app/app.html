<div class="app-shell">
  <header class="hero">
    <p class="hero-eyebrow">StudyTrack</p>
    <h1 class="hero-title">My Study Dashboard</h1>
    <p class="hero-subtitle">Track your progress, one task at a time.</p>
  </header>
  <div class="summary-grid">
    <div class="summary-tile">
      <p class="summary-value">{{ totalCount() }}</p>
      <p class="summary-label">Total</p>
    </div>
    <div class="summary-tile">
      <p class="summary-value">{{ completedCount() }}</p>
      <p class="summary-label">Completed</p>
    </div>
    <div class="summary-tile">
      <p class="summary-value">{{ remainingCount() }}</p>
      <p class="summary-label">Remaining</p>
    </div>
  </div>
  <app-goal-counter />
  @for (task of tasks(); track task.id) {
    <app-task-card [task]="task" />
  }
</div>
