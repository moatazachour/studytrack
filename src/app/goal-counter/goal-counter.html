<div class="goal-layout">
  <div class="goal-copy">
    <p class="goal-title">Daily goal</p>
    <p class="goal-description">Choose how many tasks to complete each day.</p>
  </div>

  <div class="goal-stepper">
    <button class="stepper-btn" (click)="decreaseTarget()" [disabled]="target() === minTarget">
      -
    </button>
    <span class="stepper-value">{{ target() }}</span>
    <button class="stepper-btn" (click)="increaseTarget()" [disabled]="target() === maxTarget">
      +
    </button>
  </div>
</div>
